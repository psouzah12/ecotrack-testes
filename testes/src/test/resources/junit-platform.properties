cucumber.glue=br.com.fiap.ecotrack.bdd
cucumber.plugin=pretty, summary, html:target/cucumber/relatorio.html, json:target/cucumber/cucumber.json, junit:target/cucumber/cucumber.xml
cucumber.publish.quiet=true
cucumber.snippet-type=camelcase
# o relatório do Surefire mostra o nome do cenário em vez do número da linha
cucumber.junit-platform.naming-strategy=long
